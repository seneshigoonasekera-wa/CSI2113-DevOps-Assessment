name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test application
        run: |
          python -m py_compile app.py

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_seneshi }}
          password: ${{ secrets.DOCKERHUB_GitHubActionsCICD }}

      - name: Build Docker image
        run: |
          docker build -t seneshi/csi2113-devops-app:latest .

      - name: Push Docker image
        run: |
          docker push seneshi/csi2113-devops-app:latest

  deploy-local:
    needs: docker-build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: |
          docker compose pull

      - name: Deploy application
        run: |
          docker compose up -d

      - name: Check running container
        run: |
          docker compose ps